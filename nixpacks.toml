# Nixpacks overrides for Railway (Node 22 + native build tools for optional deps)
[phases.setup]
nixPkgs = ["nodejs_22", "python3", "gcc", "gnumake"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
# keepAliveTimeout > Railway's 60s edge idle timeout (see railway.toml).
cmd = "sh -c 'npx next start -H 0.0.0.0 -p ${PORT:-3000} --keepAliveTimeout 70000'"
